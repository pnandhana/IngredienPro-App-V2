<!doctype html><meta charset="utf-8"><title>apptest2</title><pre id="out">running</pre>
<iframe id="f" style="width:1440px;height:900px"></iframe>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const res={}; const errs=[];
const F=document.getElementById('f'); const W=()=>F.contentWindow, D=()=>F.contentDocument;
const q=s=>D().querySelector(s), qa=s=>[...D().querySelectorAll(s)], byName=n=>D().querySelector('[data-name="'+n+'"]');
async function until(fn,t=6000){const s=Date.now();while(Date.now()-s<t){try{const v=fn();if(v)return v;}catch(e){}await sleep(80);}return null;}
function click(el){ if(!el) throw new Error('missing element'); el.dispatchEvent(new (W().MouseEvent)('click',{bubbles:true,cancelable:true})); }
function type(el,v){ el.textContent=v; el.dispatchEvent(new (W().Event)('input',{bubbles:true})); }
async function dismiss(){ const sc=q('.overlay-scrim'); if(sc) click(sc); await sleep(320); }
async function go(h){ W().location.hash=h; await sleep(900); }
async function role(r){ click(q('.rolebar [data-role="'+r+'"]')); await sleep(900); }
function step(name, fn){ return fn().then(v=>{res[name]=v;}).catch(e=>{res[name]='ERR '+e.message;}); }
(async()=>{
  localStorage.clear(); sessionStorage.clear();
  F.src='../index.html#/'; await until(()=>D()&&D().querySelector('.screen'));
  W().addEventListener('error',e=>errs.push(e.message)); W().console.error=(...a)=>errs.push(a.map(String).join(' ').slice(0,160));
  await step('guestGate', async()=>{ await go('#/find'); await until(()=>qa('[data-seller-id]').length); click(q('[data-seller-id] [data-name="Btn / Send enquiry"]')); await sleep(700); return !!q('.overlay [data-name="Gate modal"]'); });
  await step('guestNames', async()=>{ await dismiss(); return q('[data-name="Seller list"] > [data-seller-id]').innerText.slice(0,40).replace(/\s+/g,' '); });
  await step('loginSeller', async()=>{ await go('#/login'); const ed=await until(()=>q('.screen .editable')); type(ed,'98450 11324'); click(q('[data-name^="Btn / Send code"]')); await sleep(900); const inp=await until(()=>q('.otp-input')); inp.value='123456'; inp.dispatchEvent(new (W().Event)('input',{bubbles:true})); click(byName('Btn / Log in')); await sleep(1200); return W().location.hash+' '+D().title; });
  await step('dashboard', async()=>{ const c=byName('Card / Needs attention'); return c.innerText.replace(/\s+/g,' ').slice(0,120); });
  await step('catalogueAdd', async()=>{ await go('#/catalogue'); click(byName('Btn / Add product')); const mi=await until(()=>q('.overlay .mm-input')); type(mi,'paprika'); await sleep(700); click(await until(()=>q('.suggest-pop [data-name^="Suggestion /"]'))); await sleep(1000); return qa('[data-name="Product row"]').length+' rows; first='+qa('[data-name="Product row"]')[0].innerText.split('\n')[0]; });
  await step('sellerNotif', async()=>{ await go('#/notifications'); return qa('[data-name="Notification row"]').length; });
  await step('sellerHelp', async()=>{ await go('#/help/billing'); return D().title+' | '+(q('[data-name="Article"]')||{innerText:''}).innerText.slice(0,40); });
  await step('registerBuyer', async()=>{ await role('guest'); await go('#/register/buyer'); await sleep(300); const eds=qa('.screen .editable'); eds.forEach((e,i)=>type(e,['Asha Rao','Kaveri Foods Pvt Ltd','98470 55555','asha@kaveri.in'][i]||e.textContent)); click(byName('Button / Continue')); await sleep(900); const h1=W().location.hash; click(byName('Button / Continue')); await sleep(900); const h2=W().location.hash; click(byName('Button / Start sourcing')); await sleep(1200); return [h1,h2,W().location.hash, q('.rolebar [data-role="buyer"] small').textContent].join(' → '); });
  await step('buyerMulti', async()=>{ await go('#/seller/annapurna'); click(q('[data-name="Profile card"] [data-name="Btn / Send enquiry"]')); let m=await until(()=>q('.overlay [data-name="Modal / Send enquiry"]')); let e=[...m.querySelectorAll('.editable')]; type(e[0],'Turmeric Powder'); e[0].dispatchEvent(new (W().KeyboardEvent)('keydown',{key:'Enter',bubbles:true})); await sleep(800); m=q('.overlay [data-name="Modal / Send enquiry"]'); e=[...m.querySelectorAll('.editable')]; type(e[1],'2'); click(m.querySelector('[data-name="Button / + Add another product"]')); await sleep(900); m=q('.overlay [data-name="Modal / Send enquiry"]'); const collapsed=!!m.querySelector('[data-name="Product 1 (collapsed)"]'); e=[...m.querySelectorAll('.editable')]; type(e[0],'Cardamom 8mm — Green, bold'); e[0].dispatchEvent(new (W().KeyboardEvent)('keydown',{key:'Enter',bubbles:true})); await sleep(1100); m=q('.overlay [data-name="Modal / Send enquiry"]'); const prompt=!!m.querySelector('[data-name="Prompt / Not sold by this seller"]'); return 'collapsed:'+collapsed+' notSoldPrompt:'+prompt+' footer:'+m.querySelector('[data-name="Footer"]').innerText.split('\n')[0]; });
  await step('splitConfirm', async()=>{ const m=q('.overlay [data-name="Modal / Send enquiry"]'); const e=[...m.querySelectorAll('.editable')]; type(e[1],'100'); click(m.querySelector('[data-name="Button / Start a new enquiry"]')); const d=await until(()=>q('.overlay [data-name="Dialog / Send and start new"]')); click(d.querySelector('[data-name="Button / Send & start new enquiry"]')); await sleep(1300); return W().location.hash+' rows:'+qa('[data-name="Seller list"] > [data-seller-id]').map(r=>r.dataset.sellerId).join(','); });
  await step('buyerMyEnq', async()=>{ await go('#/myenq'); return qa('[data-conv]').length+' chats; first='+qa('[data-conv]')[0].innerText.replace(/\s+/g,' ').slice(0,80); });
  await step('dropdown', async()=>{ click(q('[data-name="Notifications bell"]')); await sleep(900); return qa('.overlay [data-name="Notification item"]').length; });
  await step('shortlists', async()=>{ await dismiss(); await role('buyer'); await go('#/shortlists'); return qa('[data-name^="Shortlisted seller /"], [data-seller-id]').length; });
  await step('registerSeller', async()=>{ await role('guest'); await go('#/register/seller'); click(byName('Button / Continue')); await sleep(900); const bx=qa('.otp-input'); bx.forEach(b=>{b.value='123456'; b.dispatchEvent(new (W().Event)('input',{bubbles:true}));}); click(byName('Button / Verify and continue')); await sleep(900); const a=W().location.hash; click(byName('Button / Continue')); await sleep(900); click(byName('Button / Run verification check')); await sleep(3600); const b=W().location.hash; click(byName('Button / Continue')); await sleep(900); const ed=q('.screen [data-name="Product search"] .editable'); type(ed,'chilli'); await sleep(700); click(await until(()=>q('.suggest-pop [data-name^="Suggestion /"]'))); await sleep(900); click(q('[data-name="Button / Continue to plan"]')); await sleep(900); click(byName('Button / Submit for review')); await sleep(3800); const c=W().location.hash; click(q('[data-name^="Button / Pay"]')); await sleep(900); click(byName('Button / Open Seller Hub')); await sleep(1200); return [a,b,c,W().location.hash, q('.rolebar [data-role="seller"] small').textContent].join(' → '); });
  res.errors=errs.slice(0,8);
  document.getElementById('out').textContent='RESULT '+JSON.stringify(res);
})().catch(e=>document.getElementById('out').textContent='ERROR '+e.message+' PARTIAL '+JSON.stringify(res));
</script>
